name = "dap-bellwether"
main = "src/index.js"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

# Must be set explicitly, and must stay above the routes table so it is a top
# level key rather than part of it. Wrangler leaves the workers.dev subdomain
# enabled by default only while no routes exist, so declaring the route below
# would otherwise switch it off and break the fallback URL, which is already
# in the README and may already be in someone's connector settings.
workers_dev = true

# The canonical connector URL. A Workers custom domain creates a proxied DNS
# record for this hostname in the dap.solutions zone and provisions its
# certificate. Nothing else in the zone is touched.
[[routes]]
pattern = "bellwether.dap.solutions"
custom_domain = true

# Four times a day. Regulators publish on business hours in four time zones,
# and six hourly collection keeps the connector fresh without hammering
# anyone's website. Raise the cadence only if a user actually notices the lag.
[triggers]
crons = ["0 */6 * * *"]

# Create with:
#   npx wrangler d1 create bellwether
# then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "bellwether"
database_id = "cb812950-20d4-45a1-b7c7-531ed0234e7b"

# DAP licences, shared with the Compute Market Tracker agent and nothing else
# (licences.sql). Created once with: npx wrangler d1 create dap-licences
# then: npm run db:migrate:licences
[[d1_databases]]
binding = "LICENCES"
database_name = "dap-licences"
database_id = "DAP_LICENCES_DATABASE_ID"

[observability]
enabled = true

# Request logs off. Workers Logs would otherwise keep a record of every
# invocation for up to seven days, and Cloudflare does not document which
# request fields it holds. The privacy statement says the Worker keeps no
# request logs, so it keeps none: only console output, which is errors and the
# ingest summary, never a caller's address or query.
[observability.logs]
invocation_logs = false

# The paid tier (src/pricing.js). Off until the secret X402_PAY_TO is set, so
# these two change nothing on their own. The secrets that switch it on are
# X402_PAY_TO, CDP_API_KEY_ID, CDP_API_KEY_SECRET and ALLOWANCE_KEY, set with
# wrangler secret put and never written here. README, "The paid tier".
[vars]
X402_NETWORKS = "eip155:8453"
FREE_CALLS_PER_DAY = "50"
